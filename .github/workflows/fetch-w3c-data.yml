name: Fetch W3C API Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜日 0:00 UTC

permissions:
  actions: read
  contents: write

concurrency:
  group: fetch-w3c-data
  cancel-in-progress: true

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
         fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Remove w3c-data.json to check for release
        run: |
          if [ -f data/w3c-data.json ]; then
            rm data/w3c-data.json
          fi

      - name: Fetch Phase1
        run: |
          node scripts/fetch-w3c-data.js --phase1
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase1-data
          path: data

  phase2:
    needs: phase1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase1-data
          path: data

      - name: Fetch Phase2
        run: |
          node scripts/fetch-w3c-data.js --phase2
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-data
          path: data

  phase3:
    needs: phase2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-data
          path: data

      - name: Fetch Phase3
        run: |
          node scripts/fetch-w3c-data.js --phase3
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-data
          path: data
  
  phase4:
    needs: phase3
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase3-data
          path: data

      - name: Fetch Phase4
        run: |
          node scripts/fetch-w3c-data.js --phase4
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase4-data
          path: data
  
  phase5:
    needs: phase4
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase4-data
          path: data

      - name: Fetch Phase5
        run: |
          node scripts/fetch-w3c-data.js --phase5
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase5-data
          path: data

  phase6:
    needs: phase5
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase5-data
          path: data

      - name: Fetch Phase6
        run: |
          node scripts/fetch-w3c-data.js --phase6
          ls -l data/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase6-data
          path: data

  release:
    needs: phase6
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # phase6 の成果物を取得
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: phase6-data
          path: data

      # w3c-data.json の存在確認
      - name: Check w3c-data.json exists
        id: check_data
        run: |
          if [ -f data/w3c-data.json ]; then
            echo "has_w3c_data=true" >> $GITHUB_OUTPUT
            echo "w3c-data.json found"
          else
            echo "has_w3c_data=false" >> $GITHUB_OUTPUT
            echo "w3c-data.json not found"
          fi

      # data/ を commit & push
      - name: Commit and push data
        if: steps.check_data.outputs.has_w3c_data == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git status
          git ls-files data/
          ls -l data/
          git add data/
          git commit --allow-empty -m "Update W3C API data - $(date +'%Y-%m-%d')"
          git push

      # SHAを取得
      - name: Get latest commit SHA
        if: steps.check_data.outputs.has_w3c_data == 'true'
        id: latest_sha
        run: |
          git fetch origin
          echo "sha=$(git rev-parse origin/main)" >> $GITHUB_OUTPUT

      # Release 作成
      - name: Create Release 
        if: steps.check_data.outputs.has_w3c_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="snapshot-$(date +'%Y-%m-%d-%H%M%S')"
          RELEASE_TITLE="W3C Dash Snapshot - $(date +'%Y-%m-%d %H:%M:%S')"

          echo "Creating release: $TAG_NAME"

          gh release create "$TAG_NAME" \
            --target "${{ steps.latest_sha.outputs.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes $'Automated W3C Dash snapshot.\n\nThis release is created only when w3c-data.json is created or updated, which indicates a complete and valid data collection run.\n\nThe source archive (zip / tar.gz) contains all generated JSON files under the data/ directory.\n\nEach JSON file includes a _metadata object with filename, lastChecked (UTC), fetchStartTime, duration, and entryCount or itemCount.\n\nFiles generated:\n- w3c-groups.json\n- w3c-participations.json\n- w3c-affiliations.json\n- w3c-users.json\n- w3c-specifications.json\n- w3c-timeline.json\n- w3c-data.json'

          echo "✓ Release created: $TAG_NAME"

      # Summary
      - name: Summary
        run: |
          echo "### W3C API Data Fetch Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **w3c-data.json present**: ${{ steps.check_data.outputs.has_w3c_data }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files in data/**: $(ls data/*.json 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

